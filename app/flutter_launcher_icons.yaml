# flutter_launcher_icons 配置：从 assets/icon/icon.png 生成 Android 与 Windows 图标
# 重新生成：dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher" # 生成各密度 mipmap-*/ic_launcher.png
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256 # ico 内嵌尺寸
