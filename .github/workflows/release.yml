name: Release

on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN 对新仓库默认只读；创建 Release 与上传产物需要 contents 写权限
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 校验 tag 与 pubspec 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -P '^version:' app/pubspec.yaml | sed 's/version:\s*//')
          [ "$TAG" = "$VER" ] || { echo "tag($TAG) ≠ pubspec($VER)"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 版本与本地开发环境对齐（Flutter 3.47.2 stable），保证产物可复现
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      - run: flutter build apk --release --split-per-abi
        working-directory: app

      - name: 重命名产物（带版本与平台标识）
        run: |
          mv app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "ThreeTutor-${{ github.ref_name }}-android-arm64.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: ThreeTutor-${{ github.ref_name }}-android-arm64.apk
          body: |
            - `ThreeTutor-vX.Y.Z-android-arm64.apk`：Android（arm64 手机）安装包
            - `ThreeTutor-vX.Y.Z-windows-x64.zip`：Windows 解压即用

  windows:
    # 钉 windows-2022（VS2022 工具链）：windows-latest 已带 VS2026，
    # permission_handler_windows 旧式 <experimental/coroutine> 会触发 STL1011 硬错误；
    # 治本需升级 permission_handler 13（跨大版本），待后续单独做
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter build windows --release
        working-directory: app

      # Release 目录整体打包（含 dll，解压即可运行）
      - name: 打包 Windows 产物
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "ThreeTutor-${{ github.ref_name }}-windows-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: ThreeTutor-${{ github.ref_name }}-windows-x64.zip
